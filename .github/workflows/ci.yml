name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  KIND_CLUSTER: agent-relay
  NAMESPACE: agent-relay

defaults:
  run:
    working-directory: agent-relay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay
          POSTGRES_DB: relay
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --frozen

      - name: Starter tests (PostgreSQL)
        env:
          RELAY_DATABASE_URL: postgresql://relay:relay@localhost:55432/relay
        run: uv run pytest -q test_agent_relay.py

      - name: Integration test against a live API (PostgreSQL)
        env:
          RELAY_DATABASE_URL: postgresql://relay:relay@localhost:55432/relay
          RELAY_BASE_URL: http://127.0.0.1:18000
        run: |
          uv run uvicorn main:app --host 127.0.0.1 --port 18000 > uvicorn.log 2>&1 &
          server=$!
          for i in $(seq 30); do
            kill -0 "$server" 2>/dev/null || { cat uvicorn.log; exit 1; }
            curl -sf "$RELAY_BASE_URL/ready" && break
            sleep 1
          done
          uv run pytest -q test_integration.py || { cat uvicorn.log; exit 1; }

  deploy:
    # Runs only when every test passed; otherwise the current release stays up.
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kind and kubectl
        working-directory: .
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL --retry 5 --retry-all-errors -o "$HOME/bin/kind" https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl -sSL --retry 5 --retry-all-errors -o "$HOME/bin/kubectl" "https://dl.k8s.io/release/$(curl -sSL --retry 5 --retry-all-errors https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x "$HOME/bin/kind" "$HOME/bin/kubectl"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Configure cluster access
        working-directory: .
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_DATA" || { echo "KUBECONFIG secret is not set"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Compute a unique image tag
        run: echo "IMAGE=agent-relay:${GITHUB_SHA::7}-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Load image into kind
        run: kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: Deploy
        run: |
          kubectl kustomize k8s/ \
            | sed "s#image: agent-relay:local#image: $IMAGE#" \
            | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status statefulset/postgres --timeout=180s
          kubectl -n "$NAMESPACE" rollout status deployment/agent-relay --timeout=180s
          kubectl -n "$NAMESPACE" get deployment agent-relay \
            -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
